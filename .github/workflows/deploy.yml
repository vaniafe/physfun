name: Deploy to server
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
      - name: Upload site files
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" index.html styles.css app.js config.js root@${{ secrets.SERVER_HOST }}:/var/www/physfun/
      - name: Reload web server
        run: ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_HOST }} "systemctl reload caddy"

